<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e3963"/>
      <stop offset="1" stop-color="#081d38"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d78a"/>
      <stop offset="1" stop-color="#c99a2e"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#bg)" stroke="#c99a2e" stroke-width="1.5"/>
  <!-- scale post -->
  <rect x="30.5" y="14" width="3" height="27" rx="1.5" fill="url(#gold)"/>
  <!-- beam -->
  <rect x="14" y="18" width="36" height="2.6" rx="1.3" fill="url(#gold)"/>
  <!-- left pan chain -->
  <path d="M16 19 L12 30" stroke="url(#gold)" stroke-width="1.6" fill="none"/>
  <path d="M16 19 L20 30" stroke="url(#gold)" stroke-width="1.6" fill="none"/>
  <path d="M9.5 30 a6.5 6.5 0 0 0 13 0 Z" fill="none" stroke="url(#gold)" stroke-width="1.8"/>
  <!-- right pan chain -->
  <path d="M48 19 L44 30" stroke="url(#gold)" stroke-width="1.6" fill="none"/>
  <path d="M48 19 L52 30" stroke="url(#gold)" stroke-width="1.6" fill="none"/>
  <path d="M41.5 30 a6.5 6.5 0 0 0 13 0 Z" fill="none" stroke="url(#gold)" stroke-width="1.8"/>
  <!-- base -->
  <path d="M23 45 L41 45 L38 41 L26 41 Z" fill="url(#gold)"/>
  <rect x="20" y="45" width="24" height="3" rx="1.5" fill="url(#gold)"/>
  <!-- small chain links motif bottom = blockchain -->
  <g fill="none" stroke="#8fb8e6" stroke-width="1.4">
    <rect x="22" y="51" width="6" height="4.2" rx="2"/>
    <rect x="27" y="51" width="6" height="4.2" rx="2"/>
    <rect x="32" y="51" width="6" height="4.2" rx="2"/>
  </g>
</svg>
